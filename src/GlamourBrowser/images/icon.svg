<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <!-- GlamourBrowser icon: a clothes hanger over a page of tiles, in the plugin's theme colors. -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#262B38"/>
      <stop offset="1" stop-color="#14161B"/>
    </linearGradient>
    <radialGradient id="glow" cx="256" cy="300" r="230" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#5B8DEF" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#5B8DEF" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="hanger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#C9D7F7"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFD98A"/>
      <stop offset="1" stop-color="#E0A43A"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="10"/>
      <feOffset dy="8"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.55"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="512" height="512" rx="104" fill="url(#bg)"/>

  <!-- The tile grid -->
  <g fill="#232836" stroke="#363D4D" stroke-width="3">
    <rect x="62" y="62" width="116" height="116" rx="22"/>
    <rect x="198" y="62" width="116" height="116" rx="22"/>
    <rect x="334" y="62" width="116" height="116" rx="22"/>
    <rect x="62" y="198" width="116" height="116" rx="22"/>
    <rect x="198" y="198" width="116" height="116" rx="22" fill="#2C3A5E" stroke="#5B8DEF"/>
    <rect x="334" y="198" width="116" height="116" rx="22"/>
    <rect x="62" y="334" width="116" height="116" rx="22"/>
    <rect x="198" y="334" width="116" height="116" rx="22"/>
    <rect x="334" y="334" width="116" height="116" rx="22"/>
  </g>

  <rect width="512" height="512" rx="104" fill="url(#glow)"/>

  <!-- The hanger -->
  <g filter="url(#shadow)" fill="none" stroke="url(#hanger)" stroke-width="30" stroke-linecap="round" stroke-linejoin="round">
    <path d="M 288 162 A 32 32 0 0 0 224 162 C 224 188.7 234.7 210 256 226"/>
    <path d="M 256 226 L 84 362 H 428 Z"/>
  </g>

  <!-- Sparkles -->
  <g fill="url(#gold)" filter="url(#shadow)">
    <path d="M 404 58 Q 404 104 450 104 Q 404 104 404 150 Q 404 104 358 104 Q 404 104 404 58 Z"/>
    <path d="M 456 166 Q 456 184 474 184 Q 456 184 456 202 Q 456 184 438 184 Q 456 184 456 166 Z"/>
  </g>
</svg>
